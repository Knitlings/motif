name: Dependabot Auto-merge to Staging

on:
  pull_request:
    branches: [staging]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    steps:
      - name: Auto-approve
        run: gh pr review --approve "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Retried because this call intermittently fails with "Branch does not
      # have required protected branch rules" when two dependabot PRs arrive
      # close together.
      - name: Enable auto-merge
        run: |
          for i in 1 2 3; do
            gh pr merge --auto --squash "$PR_URL" && exit 0
            echo "Enabling auto-merge failed (attempt $i/3), retrying..."
            sleep 20
          done
          exit 1
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
